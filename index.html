      const box = $('#prev', el); const total = plano.reduce((s, p) => s + p.novos.length + p.atualiza.length, 0), totErr = plano.reduce((s, p) => s + p.erros.length, 0);
      if (!plano.length) { box.innerHTML = `<div class="card">${emptyHTML('sheet', 'Nada para importar', 'Nenhuma linha preenchida nas abas da planilha modelo (os nomes das abas precisam ser os mesmos do modelo).')}</div>`; return; }
      box.innerHTML = `<div class="card"><div class="card-h"><div class="ic">${ic('checksq')}</div><h3>Conferência — ${esc(file.name)}</h3><div class="r"><button class="btn" id="pcan">Cancelar</button><button class="btn pri" id="pok" ${total ? '' : 'disabled'}>${ic('check')}Importar ${total} registro(s)</button></div></div>
        ${totErr ? `<div class="badge warn" style="white-space:normal;padding:10px;border-radius:10px;margin-bottom:12px;display:block">${ic('alert')} ${totErr} problema(s) encontrado(s) — essas linhas serão ignoradas. Corrija na planilha e importe de novo, ou continue só com as linhas válidas.</div>` : ''}
        <div class="tbl-wrap" style="box-shadow:none"><table class="tbl"><thead><tr><th>Aba</th><th class="r">Novos</th><th class="r">Atualizar</th><th class="r">Com erro</th><th class="r hide-m">Ignoradas</th></tr></thead><tbody>
        ${plano.map(p => `<tr><td><b>${esc(SPEC[p.t].label)}</b></td><td class="r"><span class="badge ok">${p.novos.length}</span></td><td class="r"><span class="badge info">${p.atualiza.length}</span></td><td class="r">${p.erros.length ? `<span class="badge bad">${p.erros.length}</span>` : '0'}</td><td class="r hide-m muted">${p.ignoradas}</td></tr>${p.erros.length ? `<tr><td colspan="5" style="background:var(--badbg)"><div style="font-size:12.5px;color:var(--bad)">${p.erros.slice(0, 8).map(esc).join('<br>')}${p.erros.length > 8 ? `<br>… e mais ${p.erros.length - 8}` : ''}</div></td></tr>` : ''}`).join('')}</tbody></table></div>
        <div class="muted" style="font-size:12px;margin-top:8px">Linhas de exemplo e linhas vazias são ignoradas automaticamente.</div></div>`;

      $('#pok', box).onclick = async () => {
        const b = $('#pok', box); b.disabled = true; b.innerHTML = '<span class="spin"></span>Importando';

        box.innerHTML = `<div class="card"><div class="card-h"><div class="ic ${errs.length ? 'warn' : 'ok'}">${ic(errs.length ? 'alert' : 'check')}</div><h3>Importação concluída: ${ok} registro(s) gravado(s)</h3></div>
          ${res.map(r => `<div class="row" style="padding:4px 0"><span>${esc(SPEC[r.t].label)}</span><span class="sp"></span><span class="badge ok">${r.ok} ok</span>${r.errsExec.length ? `<span class="badge bad">${r.errsExec.length} erro(s)</span>` : ''}</div>`).join('')}
          ${errs.length ? `<div style="margin-top:10px;font-size:12.5px;color:var(--bad)">${errs.slice(0, 15).map(esc).join('<br>')}</div>` : ''}</div>`;
        toast(`${ok} registro(s) importado(s).`, errs.length ? 'info' : 'ok'); inp.value = '';

  };
  inp.onchange = () => ler(inp.files[0]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); ler(e.dataTransfer.files[0]); };
};

function menuEfetivo() {
  const custom = App.familia?.configuracoes?.menuCustom;
  let grupos;
  if (!custom?.length) grupos = MENU_BASE.map(g => ({ key: g.g, nome: g.g, icon: g.icon || 'grid', itens: g.items.map(([r, t]) => ({ r, nome: t })) }));
  else {
    const vistos = new Set();
    grupos = custom.map(cg => ({ key: cg.key, nome: cg.nome || cg.key, icon: cg.icon || 'grid', itens: (cg.itens || []).filter(i => BASE_ITEM[i.r] && !vistos.has(i.r) && vistos.add(i.r)).map(i => ({ r: i.r, nome: i.nome || BASE_ITEM[i.r].t })) }));
    // funções novas (de versões futuras) entram no grupo original
    Object.entries(BASE_ITEM).forEach(([r, b]) => { if (vistos.has(r)) return; let g = grupos.find(x => x.key === b.g); if (!g) { g = { key: b.g, nome: b.g, icon: (MENU_BASE.find(x => x.g === b.g) || {}).icon || 'grid', itens: [] }; grupos.push(g); } g.itens.push({ r, nome: b.t }); });

  return grupos;
}
function menuVisivel() {
  const off = menuOff();

}

  };
