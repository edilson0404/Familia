<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FAMILIA — Central de Gestão Familiar</title>
<meta name="description" content="FAMILIA — central inteligente de organização, planejamento e gestão familiar.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%23f59e0b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='22' cy='22' r='7' fill='white'/%3E%3Ccircle cx='42' cy='22' r='7' fill='white'/%3E%3Ccircle cx='32' cy='38' r='5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#4f46e5; --sec:#f59e0b;
  --bg:#f6f7fb; --bg2:#eef0f7; --card:#ffffff; --card2:#f9fafc; --line:#e6e8f0; --line2:#d9dce7;
  --tx:#141827; --tx2:#4a5168; --tx3:#8a90a6;
  --ok:#16a34a; --okbg:#e8f7ee; --warn:#d97706; --warnbg:#fef4e2; --bad:#dc2626; --badbg:#fdecec; --info:#0284c7; --infobg:#e6f4fb;
  --sh1:0 1px 2px rgba(20,24,39,.05),0 1px 1px rgba(20,24,39,.03);
  --sh2:0 6px 24px -8px rgba(20,24,39,.16),0 2px 6px rgba(20,24,39,.05);
  --sh3:0 24px 64px -16px rgba(20,24,39,.32);
  --r:14px; --r2:10px; --r3:8px;
  --side:264px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f1a; --bg2:#121628; --card:#151a2c; --card2:#1a2034; --line:#252b42; --line2:#30374f;
  --tx:#eef0f8; --tx2:#b2b8cf; --tx3:#7a8199;
  --okbg:#10291b; --warnbg:#2c2110; --badbg:#2d1414; --infobg:#0d2433;
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 8px 28px -10px rgba(0,0,0,.6); --sh3:0 24px 64px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c0f1a; --bg2:#121628; --card:#151a2c; --card2:#1a2034; --line:#252b42; --line2:#30374f;
  --tx:#eef0f8; --tx2:#b2b8cf; --tx3:#7a8199;
  --okbg:#10291b; --warnbg:#2c2110; --badbg:#2d1414; --infobg:#0d2433;
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 8px 28px -10px rgba(0,0,0,.6); --sh3:0 24px 64px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.has-bg{background-image:linear-gradient(color-mix(in srgb,var(--bg) 86%,transparent),color-mix(in srgb,var(--bg) 92%,transparent)),var(--bgimg);background-size:cover;background-attachment:fixed;background-position:center}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
::selection{background:color-mix(in srgb,var(--pri) 25%,transparent)}

/* ---------- auth ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{position:relative;overflow:hidden;background:radial-gradient(1200px 600px at 10% 10%,color-mix(in srgb,var(--pri) 85%,#000) 0%,transparent 60%),radial-gradient(900px 600px at 90% 90%,color-mix(in srgb,var(--sec) 75%,#000) 0%,transparent 55%),#0b0d18;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.auth-art h1{font-size:44px;line-height:1.05;letter-spacing:-.03em;margin:0 0 14px;font-weight:800}
.auth-art p{opacity:.78;max-width:440px;font-size:16px}
.auth-feats{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px}
.auth-feat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13.5px;backdrop-filter:blur(6px)}
.auth-box{display:flex;align-items:center;justify-content:center;padding:32px}
.auth-card{width:100%;max-width:400px}
.auth-card h2{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
.auth-card .muted{margin-bottom:22px}
.auth-tabs{display:flex;background:var(--bg2);border-radius:12px;padding:4px;margin-bottom:20px}
.auth-tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;color:var(--tx2);font-weight:600}
.auth-tabs button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh1)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--pri),var(--sec));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px -6px var(--pri)}
.logo-mark svg{width:20px;height:20px;stroke:#fff}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.shell.collapsed{--side:76px}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:width .2s}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 12px}
.side-scroll{overflow:auto;flex:1;padding:4px 10px 16px}
.side-scroll::-webkit-scrollbar{width:6px}.side-scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
.nav-g{margin-top:8px}
.nav-gh{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--tx3);cursor:pointer;text-transform:uppercase;border-radius:8px}
.nav-gh:hover{color:var(--tx2)}
.nav-gh .chev{margin-left:auto;transition:transform .2s;width:14px;height:14px}
.nav-g.closed .chev{transform:rotate(-90deg)}
.nav-g.closed .nav-items{display:none}
.nav-it{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:var(--tx2);text-decoration:none;font-weight:550;font-size:14px;cursor:pointer;border:0;background:none;width:100%;text-align:left;transition:background .15s,color .15s}
.nav-it:hover{background:var(--bg2);color:var(--tx)}
.nav-it.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
.nav-it .badge{margin-left:auto}
.shell.collapsed .side .lbl,.shell.collapsed .nav-gh span,.shell.collapsed .nav-gh .chev,.shell.collapsed .nav-it .badge,.shell.collapsed .side-foot .lbl{display:none}
.shell.collapsed .nav-g.closed .nav-items{display:block}
.shell.collapsed .nav-it{justify-content:center}
.side-foot{border-top:1px solid var(--line);padding:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0;letter-spacing:-.01em;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb{font-size:12px;color:var(--tx3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.env{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:var(--sh1)}
.env button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;font-size:12.5px;letter-spacing:.03em;color:var(--tx2);cursor:pointer;display:flex;gap:6px;align-items:center}
.env button.on{background:var(--pri);color:#fff}
.env button svg{width:15px;height:15px}
.content{padding:24px;max-width:1440px;width:100%;margin:0 auto;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hamb{display:none}

/* presence */
.pres{display:flex;align-items:center;cursor:pointer;position:relative}
.pres .av{margin-left:-8px;border:2px solid var(--bg)}
.pres .av:first-child{margin-left:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--tx2);position:relative;flex:none;background-size:cover;background-position:center}
.av.lg{width:64px;height:64px;font-size:22px}
.av.xl{width:96px;height:96px;font-size:30px}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--tx3);border:2px solid var(--card)}
.av .dot.on{background:var(--ok)}
.pop{position:absolute;top:calc(100% + 10px);right:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh3);min-width:280px;padding:8px;z-index:50;animation:fadeUp .18s ease}
.pop-it{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px}
.pop-it:hover{background:var(--bg2)}

/* ---------- components ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.005em}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri);flex:none}
.ic.ok{background:var(--okbg);color:var(--ok)}.ic.bad{background:var(--badbg);color:var(--bad)}.ic.warn{background:var(--warnbg);color:var(--warn)}.ic.info{background:var(--infobg);color:var(--info)}.ic.sec{background:color-mix(in srgb,var(--sec) 16%,transparent);color:var(--sec)}
.kpi{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lbl{color:var(--tx2);font-size:12.5px;font-weight:600}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--tx3)}
.kpi .ic{position:absolute;right:16px;top:16px}
.muted{color:var(--tx3)}.tx2{color:var(--tx2)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:650;font-size:13.5px;cursor:pointer;color:var(--tx);transition:all .15s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--tx3);background:var(--card2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 4px 14px -6px var(--pri)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}.btn.danger:hover{background:var(--badbg);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--bg2)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:7px;width:34px;height:34px}
.btn.sm.icon{width:28px;height:28px;padding:5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--bg2);color:var(--tx2);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.info{background:var(--infobg);color:var(--info)}.badge.pri{background:color-mix(in srgb,var(--pri) 14%,transparent);color:var(--pri)}
.badge.dotb::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--tx2)}
.chip.on{background:var(--tx);color:var(--card);border-color:var(--tx)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.inp,.sel,textarea.inp{width:100%;border:1px solid var(--line2);background:var(--card);padding:9px 12px;border-radius:10px;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus,.sel:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
textarea.inp{min-height:84px;resize:vertical}
.search{position:relative;min-width:220px;flex:1;max-width:360px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx3);width:16px;height:16px}
.search .inp{padding-left:34px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12.5px;font-weight:650;color:var(--tx2)}
.fld label .req{color:var(--bad)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-weight:600;font-size:13.5px}
.switch input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.switch input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:var(--sh1)}
.switch input:checked{background:var(--pri)}.switch input:checked::after{left:19px}
.seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:650;font-size:12.5px;color:var(--tx2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh1)}

/* table */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--sh1)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--card2);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--card2)}
.tbl tbody tr.click{cursor:pointer}
.tbl td.act{white-space:nowrap;text-align:right;width:1%}
.tbl .r{text-align:right}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12px;color:var(--tx3)}
.li .grow{flex:1;min-width:0}
.empty{text-align:center;padding:40px 16px;color:var(--tx3)}
.empty .ic{margin:0 auto 12px;width:48px;height:48px;border-radius:14px}
.empty .ic svg{width:24px;height:24px}
.empty h4{margin:0 0 4px;color:var(--tx2);font-size:15px}
.prog{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),color-mix(in srgb,var(--pri) 60%,var(--sec)));border-radius:99px;transition:width .6s ease}
.prog.ok>i{background:var(--ok)}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}
.skel{background:linear-gradient(90deg,var(--bg2),var(--card2),var(--bg2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}
@keyframes sk{to{background-position:-200% 0}}
.spin{width:18px;height:18px;border:2.5px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--tx3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:650;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
.section-t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:22px 0 10px}
.hero{border-radius:20px;padding:24px 26px;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 92%,#000),color-mix(in srgb,var(--pri) 55%,var(--sec)));position:relative;overflow:hidden;box-shadow:var(--sh2)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h2{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
.hero p{margin:0;opacity:.85}
.hero .hstats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:1}
.hero .hstats div{display:flex;flex-direction:column}
.hero .hstats b{font-size:20px;font-variant-numeric:tabular-nums}
.hero .hstats span{font-size:12px;opacity:.8}

/* modal */
.ov{position:fixed;inset:0;background:rgba(9,11,20,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:18px;box-shadow:var(--sh3);width:100%;max-width:720px;animation:pop .2s cubic-bezier(.2,.9,.3,1.2);border:1px solid var(--line)}
.modal.sm{max-width:440px}.modal.lg{max-width:1000px}
@keyframes pop{from{transform:scale(.97) translateY(8px);opacity:0}}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:17px}
.modal-b{padding:20px 22px;max-height:70vh;overflow:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--card2);border-radius:0 0 18px 18px;flex-wrap:wrap}
/* toast */
.toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--tx);color:var(--card);padding:12px 16px;border-radius:12px;box-shadow:var(--sh3);display:flex;gap:10px;align-items:flex-start;animation:fadeUp .25s;font-weight:550;font-size:13.5px}
.toast.ok svg{color:#4ade80}.toast.bad svg{color:#f87171}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.cal-hd{padding:9px;font-size:11.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;background:var(--card2);border-bottom:1px solid var(--line);text-align:center}
.cal-d{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;transition:background .12s;min-width:0}
.cal-d:nth-child(7n){border-right:0}
.cal-d:hover{background:var(--card2)}
.cal-d.out{background:var(--bg);opacity:.6}
.cal-d .n{font-size:12.5px;font-weight:700;color:var(--tx2);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal-d.today .n{background:var(--pri);color:#fff}
.ev{font-size:11.5px;padding:2px 6px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-left:3px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}
.week{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.week .hcell{font-size:11px;color:var(--tx3);padding:4px 6px;border-bottom:1px solid var(--line);height:44px;text-align:right}
.week .dcol{border-left:1px solid var(--line);position:relative}
.week .slot{height:44px;border-bottom:1px solid var(--line)}
.week .wev{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 6px;font-size:11.5px;font-weight:600;overflow:hidden;color:#fff;cursor:pointer;box-shadow:var(--sh1)}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 18px}
.tl::before{content:"";position:absolute;left:-19px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--pri)}
.tl .d{font-size:12px;color:var(--tx3);font-weight:600}
/* market mode */
.mk-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px;transition:all .2s}
.mk-item.comprado{opacity:.55}.mk-item.comprado .t{text-decoration:line-through}
.mk-check{width:44px;height:44px;border-radius:12px;border:2px solid var(--line2);display:grid;place-items:center;cursor:pointer;flex:none;background:var(--card)}
.mk-item.comprado .mk-check{background:var(--ok);border-color:var(--ok);color:#fff}
.goal{overflow:hidden;padding:0}
.goal-img{height:120px;background:linear-gradient(135deg,color-mix(in srgb,var(--pri) 70%,#000),var(--sec));background-size:cover;background-position:center;position:relative}
.goal-img .badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.45);color:#fff}
.goal-b{padding:16px}
.folder{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:550;color:var(--tx2)}
.folder:hover{background:var(--bg2)}.folder.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
.chat{display:flex;flex-direction:column;gap:12px;min-height:360px;max-height:60vh;overflow:auto;padding:4px}
.msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--bg2);border-bottom-left-radius:4px}
.dash-card{position:relative}
.dash-edit .dash-card{outline:2px dashed var(--line2);outline-offset:3px;cursor:grab}
.dash-edit .dash-card.drag{opacity:.4}
.dash-tools{position:absolute;top:8px;right:8px;display:none;gap:4px;z-index:2}
.dash-edit .dash-tools{display:flex}
.swatch{width:30px;height:30px;border-radius:9px;cursor:pointer;border:2px solid transparent;box-shadow:var(--sh1)}
.swatch.on{border-color:var(--tx)}
.kbd{font-family:var(--mono);font-size:12px;background:var(--bg2);padding:1px 6px;border-radius:5px}
.drop{border:2px dashed var(--line2);border-radius:var(--r);padding:28px;text-align:center;color:var(--tx3);cursor:pointer;transition:all .15s}
.drop:hover,.drop.over{border-color:var(--pri);color:var(--pri);background:color-mix(in srgb,var(--pri) 5%,transparent)}
.attach{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.attach img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.pill-sel{display:flex;flex-wrap:wrap;gap:6px}
.perm-tbl td,.perm-tbl th{text-align:center}
.perm-tbl td:first-child,.perm-tbl th:first-child{text-align:left}
.perm-tbl select{padding:4px 6px;border-radius:7px;border:1px solid var(--line2);background:var(--card);font-size:12.5px}

/* responsive */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){
  .auth{grid-template-columns:1fr}.auth-art{display:none}
  .shell,.shell.collapsed{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:280px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--sh3)}
  .shell.mob-open .side{transform:none}
  .shell.collapsed .side .lbl,.shell.collapsed .nav-gh span{display:initial}
  .hamb{display:inline-flex}
  .g3,.g2{grid-template-columns:1fr}
  .top{padding:10px 14px}.content{padding:16px}
  .top .crumb{display:none}
  .cal-d{min-height:72px;padding:3px}.ev{font-size:10px;padding:1px 3px}
}
@media (max-width:640px){
  .g4{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}
  .env button span{display:none}
  .kpi .val{font-size:19px}
  .pres .av:nth-child(n+3){display:none}
  .modal-b{max-height:none}.ov{padding:0}.modal{border-radius:0;min-height:100%}
  .tbl .hide-m{display:none}
  .toasts{left:12px;right:12px;bottom:12px}
}
.mob-back{display:none}
@media (max-width:960px){.shell.mob-open .mob-back{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}}
@media print{.side,.top,.toolbar,.btn{display:none!important}.shell{display:block}.card{box-shadow:none;break-inside:avoid}body{background:#fff}}

function toast(msg, type = 'ok', ms = 3600) {
  let box = $('.toasts'); if (!box) { box = document.createElement('div'); box.className = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast ' + type;
  t.innerHTML = ic(type === 'bad' ? 'alert' : type === 'info' ? 'info' : 'ok') + `<div>${esc(msg)}</div>`;
  box.appendChild(t); setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, ms);
}
let modalStack = 0;
function modal({ title, body, size = '', foot = null, onClose = null, icon = null }) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true">
    <div class="modal-h">${icon ? `<div class="ic">${ic(icon)}</div>` : ''}<h3>${esc(title)}</h3><div class="sp"></div><button class="btn ghost icon" data-x aria-label="Fechar">${ic('x')}</button></div>
    <div class="modal-b"></div>${foot !== false ? '<div class="modal-f"></div>' : ''}</div>`;
  const b = $('.modal-b', ov); if (typeof body === 'string') b.innerHTML = body; else if (body) b.appendChild(body);
  if (foot) $('.modal-f', ov).innerHTML = foot; else if (foot === null) $('.modal-f', ov)?.remove();
  const close = () => { ov.remove(); modalStack--; document.removeEventListener('keydown', onKey); onClose && onClose(); };
  const onKey = (e) => { if (e.key === 'Escape' && ov === $$('.ov').pop()) close(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) close(); });
  $('[data-x]', ov).onclick = close;
  document.body.appendChild(ov); modalStack++;
  return { el: ov, body: b, foot: $('.modal-f', ov), close };
}
function confirmDlg(msg, { title = 'Confirmar', ok = 'Confirmar', danger = true } = {}) {
  return new Promise(res => {
    let done = false;
    const m = modal({ title, size: 'sm', icon: danger ? 'alert' : 'info', body: `<p style="margin:0">${esc(msg)}</p>`,
      foot: `<button class="btn" data-c>Cancelar</button><button class="btn ${danger ? 'danger' : 'pri'}" data-ok>${esc(ok)}</button>`,
      onClose: () => { if (!done) res(false); } });
    $('[data-c]', m.el).onclick = () => m.close();
    $('[data-ok]', m.el).onclick = () => { done = true; res(true); m.close(); };
  });
}
function promptDlg(title, label, value = '') {
  return new Promise(res => {
    let done = false;
    const m = modal({ title, size: 'sm', body: `<div class="fld"><label>${esc(label)}</label><input class="inp" value="${esc(value)}"></div>`,
      foot: `<button class="btn" data-c>Cancelar</button><button class="btn pri" data-ok>OK</button>`, onClose: () => { if (!done) res(null); } });
    const inp = $('input', m.el); inp.focus(); inp.select();
    const ok = () => { done = true; res(inp.value); m.close(); };
    inp.onkeydown = (e) => { if (e.key === 'Enter') ok(); };
    $('[data-c]', m.el).onclick = () => m.close(); $('[data-ok]', m.el).onclick = ok;

}

/* ======================================================================
   AUTENTICAÇÃO (Neon Auth / Better Auth) — sessão por cookie seguro + JWT curto
   ====================================================================== */
const Auth = {
  jwt: null, jwtExp: 0, user: null, bearer: null,
  _opts(method, body) {
    const h = { 'Content-Type': 'application/json' };
    if (this.bearer) h.Authorization = 'Bearer ' + this.bearer;
    return { method, credentials: 'include', headers: h, body: body ? JSON.stringify(body) : undefined };
  },
  async call(path, method = 'GET', body = null) {
    let r;
    try { r = await fetch(CONFIG.AUTH_URL + path, this._opts(method, body)); }
    catch (e) { throw new Error('Sem conexão com o servidor de autenticação. Verifique a internet e se este endereço está liberado no Neon Auth.'); }
    const bt = r.headers.get('set-auth-token'); if (bt) { this.bearer = bt; try { sessionStorage.setItem('fam_bt', bt); } catch (_) { } }
    const jwt = r.headers.get('set-auth-jwt'); if (jwt) this._setJwt(jwt);
    let data = null; const txt = await r.text(); try { data = txt ? JSON.parse(txt) : null; } catch (_) { data = { message: txt }; }
    if (!r.ok) { const m = data?.message || data?.error?.message || data?.code || ('Erro ' + r.status); const err = new Error(traduzErroAuth(m)); err.status = r.status; throw err; }
    return data;
  },
  _setJwt(t) {
    try { const p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); this.jwt = t; this.jwtExp = (p.exp || 0) * 1000; } catch (_) { }
  },
  async signIn(email, password) { const d = await this.call('/sign-in/email', 'POST', { email, password, rememberMe: true }); this.user = d?.user || null; this.jwt = null; return d; },
  async signUp(name, email, password) { const d = await this.call('/sign-up/email', 'POST', { name, email, password }); this.user = d?.user || null; this.jwt = null; return d; },
  async signOut() { try { await this.call('/sign-out', 'POST', {}); } catch (_) { } this.jwt = null; this.user = null; this.bearer = null; try { sessionStorage.removeItem('fam_bt'); } catch (_) { } },
  async session() {
    try { this.bearer = this.bearer || sessionStorage.getItem('fam_bt'); } catch (_) { }
    const d = await this.call('/get-session', 'GET'); this.user = d?.user || null; return d && d.user ? d : null;
  },
  async token(force = false) {
    if (!force && this.jwt && Date.now() < this.jwtExp - 60000) return this.jwt;
    try { const d = await this.call('/token', 'GET'); if (d?.token) this._setJwt(d.token); } catch (e) { if (e.status === 401) throw new Error('SESSAO'); }
    if (!this.jwt || Date.now() >= this.jwtExp - 5000) { await this.call('/get-session', 'GET'); }
    if (!this.jwt) throw new Error('SESSAO');
    return this.jwt;
  },
  async forgot(email) { return this.call('/request-password-reset', 'POST', { email, redirectTo: location.href.split('?')[0].split('#')[0] + '?reset=1' }); },
  async reset(token, newPassword) { return this.call('/reset-password', 'POST', { token, newPassword }); },
  async changePassword(currentPassword, newPassword) { return this.call('/change-password', 'POST', { currentPassword, newPassword, revokeOtherSessions: true }); },
  async updateUser(fields) { return this.call('/update-user', 'POST', fields); }
};
function traduzErroAuth(m) {
  const s = String(m);
  const map = [[/invalid email or password|invalid_email_or_password|INVALID_EMAIL_OR_PASSWORD/i, 'E-mail ou senha inválidos.'], [/user already exists|USER_ALREADY_EXISTS/i, 'Já existe uma conta com este e-mail.'],
    [/password.*(short|too_short)|PASSWORD_TOO_SHORT/i, 'A senha precisa ter pelo menos 8 caracteres.'], [/invalid origin|INVALID_ORIGIN|MISSING_OR_NULL_ORIGIN|origin/i, location.protocol === 'file:' ? 'O login não funciona com o arquivo aberto do computador. Use o site publicado no GitHub Pages.' : 'Este endereço (' + location.origin + ') não está autorizado no Neon Auth (domínios confiáveis).'],
    [/email.*not.*verified/i, 'Confirme seu e-mail antes de entrar.'], [/invalid.*token/i, 'Link inválido ou expirado.'], [/banned/i, 'Usuário bloqueado.']];
  for (const [re, t] of map) if (re.test(s)) return t; return s;
}

const DB = {
  async req(path, { method = 'GET', body, headers = {}, retry = true } = {}) {
    let tok; try { tok = await Auth.token(); } catch (e) { App.sessionLost(); throw new Error('Sua sessão expirou. Entre novamente.'); }
    let r;
    try {
      r = await fetch(CONFIG.API_URL + path, { method, headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json', Accept: 'application/json', ...headers }, body: body !== undefined ? JSON.stringify(body) : undefined, keepalive: headers['x-keepalive'] ? true : undefined });
    } catch (e) { throw new Error('Falha de conexão com o banco de dados.'); }
    if (r.status === 401 && retry) { await Auth.token(true).catch(() => { }); return this.req(path, { method, body, headers, retry: false }); }
    const txt = await r.text(); let data = null; try { data = txt ? JSON.parse(txt) : null; } catch (_) { data = txt; }
    if (!r.ok) { throw new Error(traduzErroDB(data, r.status)); }

  },
  qs(params = {}) { const p = new URLSearchParams(); for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null) p.append(k, v); const s = p.toString(); return s ? '?' + s : ''; },
  list(table, params = {}) { return this.req('/' + table + this.qs({ select: '*', limit: 10000, ...params })); },
  async insert(table, rows) { return this.req('/' + table, { method: 'POST', body: rows, headers: { Prefer: 'return=representation' } }); },
  async update(table, id, patch) { const d = await this.req('/' + table + '?id=eq.' + encodeURIComponent(id), { method: 'PATCH', body: patch, headers: { Prefer: 'return=representation' } }); if (Array.isArray(d) && !d.length) throw new Error('Sem permissão para alterar este registro.'); return d; },
  async updateWhere(table, filter, patch) { return this.req('/' + table + this.qs(filter), { method: 'PATCH', body: patch, headers: { Prefer: 'return=representation' } }); },
  async del(table, id) { const d = await this.req('/' + table + '?id=eq.' + encodeURIComponent(id), { method: 'DELETE', headers: { Prefer: 'return=representation' } }); if (Array.isArray(d) && !d.length) throw new Error('Sem permissão para excluir este registro.'); return d; },
  rpc(fn, args = {}, extra = {}) { return this.req('/rpc/' + fn, { method: 'POST', body: args, headers: extra }); }
};
function traduzErroDB(d, st) {
  const m = (d && (d.message || d.msg || d.error)) || String(d || '');
  if (/row-level security|violates row-level/i.test(m)) return 'Você não tem permissão para esta ação.';
  if (/permission denied/i.test(m)) return 'Permissão negada pelo banco de dados.';
  if (/JWT expired/i.test(m)) return 'Sessão expirada. Tente novamente.';
  if (/duplicate key/i.test(m)) return 'Registro duplicado.';
  if (/foreign key/i.test(m)) return 'Este registro está vinculado a outros dados.';
  if (/check constraint.*tamanho|conteudo/i.test(m)) return 'Arquivo grande demais (máx. 8 MB).';
  if (/null value in column "(\w+)"/i.test(m)) return 'Campo obrigatório não preenchido: ' + m.match(/column "(\w+)"/)[1];
  if (/schema cache/i.test(m)) return 'Estrutura do banco atualizada — recarregue a página em instantes.';
  return m || ('Erro ' + st);
}

/* ======================================================================

const CRUD_ST = {};

function cellHTML(table, f, v, row, refs) {
  if (v === null || v === undefined || v === '') return '<span class="muted">—</span>';
  switch (f.w) {
    case 'money': { const n = Number(v); const neg = table === 'lancamentos' && row.tipo !== 'receita' && f.col === 'valor'; return `<span class="num ${neg ? '' : n < 0 ? 'neg' : ''}">${money(v)}</span>`; }
    case 'number': return `<span class="num">${Number(v).toLocaleString('pt-BR')}</span>`;
    case 'date': return fmtD(v);
    case 'datetime': return fmtDT(v);
    case 'bool': return v ? `<span class="badge ok">${ic('check')}Sim</span>` : '<span class="muted">Não</span>';
    case 'select': return `<span class="badge ${badgeTone(f.col, v)}">${esc(lbl(v))}</span>`;
    case 'color': return `<span class="row"><span class="swatch" style="background:${esc(v)};width:18px;height:18px;border-radius:5px"></span></span>`;
    case 'url': return `<a href="${esc(v)}" target="_blank" rel="noopener">abrir</a>`;
    case 'ref': { const r = (refs[f.ref] || []).find(x => x.id === v); return r ? esc(titleOf(f.ref, r)) : '<span class="muted">—</span>'; }

function badgeTone(col, v) {
  if (['pago', 'concluido', 'feito', 'comprado', 'atingido', 'realizada', 'ativo', 'receita', 'concluida'].includes(v)) return 'ok';
  if (['pendente', 'a_fazer', 'agendado', 'adiado', 'planejando', 'em_andamento', 'aberta'].includes(v)) return 'warn';
  if (['cancelado', 'cancelada', 'nao_encontrado', 'urgente', 'bloqueado', 'recusou', 'passivo', 'divida'].includes(v)) return 'bad';
  if (['alta'].includes(v)) return 'bad'; if (['media'].includes(v)) return 'warn';

}
function lancStatus(r) {
  const rec = r.recorrencia && r.recorrencia !== 'nenhuma' ? `<span class="badge pri" title="Lançamento recorrente">${ic('refresh')}${lbl(r.recorrencia)}</span> ` : (num(r.parcelas_total) > 1 ? `<span class="badge">${r.parcela_atual || 1}/${r.parcelas_total}</span> ` : '');
  const R = isRec(r); let s;

  else if (r.status === 'cancelado') s = `<span class="badge">Cancelado</span>`;
  else if (!r.status) s = (r.data_lancamento > todayISO() ? `<span class="badge">Previsto</span>` : `<span class="badge ok">Lançado</span>`);
  else { const v = r.data_vencimento || r.data_lancamento; const d = daysBetween(todayISO(), v);

  return rec + s;
}

/* ---------------------------------------------------------------- tela de listagem */
async function crudView(el, cfg) {
  const t = cfg.table, spec = SPEC[t], mod = spec.modulo;
  if (SEMPRE_FAMILIA.includes(t)) cfg = { ...cfg, env: 'familia', lockEnv: true };
  const env = cfg.env || App.env;
  const canEdit = App.pode(mod, 'editar') || env === 'pessoal';
  const stKey = App.route + ':' + t + ':' + env; const st = CRUD_ST[stKey] || (CRUD_ST[stKey] = { q: '', f: {}, sort: cfg.sort || null, desc: cfg.desc ?? true });
  const refTables = [...new Set(spec.fields.filter(f => f.w === 'ref').map(f => f.ref))];
  const [all, ...refsArr] = await Promise.all([App.data(t), ...refTables.map(r => App.data(r))]);
  const refs = Object.fromEntries(refTables.map((r, i) => [r, refsArr[i]]));
  let rows = all.filter(r => r.escopo === env);
  if (cfg.fixed) rows = rows.filter(r => Object.entries(cfg.fixed).every(([k, v]) => Array.isArray(v) ? v.includes(r[k]) : r[k] === v));
  if (cfg.where) rows = rows.filter(cfg.where);

  const cols = (cfg.columns || spec.fields.filter(f => !['textarea', 'hidden'].includes(f.w)).slice(0, 6).map(f => f.col));

  const draw = () => {
    let list = rows.slice();
    if (st.q) { const q = norm(st.q); list = list.filter(r => spec.fields.some(f => norm(r[f.col]).includes(q))); }
    for (const [k, v] of Object.entries(st.f)) if (v) list = list.filter(r => String(r[k] ?? '') === v);
    const sortCol = st.sort || cols.find(c => ['date', 'datetime'].includes(fieldOf(t, c)?.w)) || null;
    if (cfg.sortFn && !st.sort) list.sort(cfg.sortFn); else if (sortCol) list.sort((a, b) => { const A = a[sortCol] ?? '', B = b[sortCol] ?? ''; const n = typeof A === 'number' || fieldOf(t, sortCol)?.w === 'money' ? Number(A) - Number(B) : String(A).localeCompare(String(B), 'pt-BR'); return st.desc ? -n : n; });
    const total = cfg.sumCol ? list.reduce((s, r) => s + num(r[cfg.sumCol]), 0) : null;
    $('#cl', el).innerHTML = list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c => `<th data-s="${c}" class="${['money', 'number'].includes(fieldOf(t, c)?.w) ? 'r' : ''} ${cfg.hideM?.includes(c) ? 'hide-m' : ''}">${esc(cfg.labels?.[c] || fieldOf(t, c)?.label || c)}${(st.sort === c) ? (st.desc ? ' ↓' : ' ↑') : ''}</th>`).join('')}${cfg.statusCol ? '<th>Situação</th>' : ''}<th></th></tr></thead>
      <tbody>${list.map(r => `<tr class="click" data-id="${r.id}">${cols.map(c => { const f = fieldOf(t, c) || { w: 'text', col: c }; return `<td class="${['money', 'number'].includes(f.w) ? 'r' : ''} ${cfg.hideM?.includes(c) ? 'hide-m' : ''}">${cfg.cell?.[c] ? cfg.cell[c](r, refs) : cellHTML(t, f, r[c], r, refs)}</td>`; }).join('')}
        ${cfg.statusCol ? `<td>${cfg.statusCol(r)}</td>` : ''}<td class="act">${cfg.rowActions ? cfg.rowActions(r) : ''}${canEdit ? `<button class="btn ghost sm icon" data-del="${r.id}" title="Excluir">${ic('trash')}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>
      <div class="row muted" style="margin-top:10px;font-size:12.5px"><span>${list.length} registro(s)</span>${total !== null ? `<span class="sp"></span><b class="num tx2">Total: ${money(total)}</b>` : ''}</div>`
      : emptyHTML(spec.icon || 'list', rows.length ? 'Nada encontrado com esses filtros' : `Nenhum registro em ${env === 'pessoal' ? 'Meu espaço' : 'Família'}`, rows.length ? 'Ajuste a busca ou os filtros.' : (canEdit ? 'Clique em “Novo” para cadastrar o primeiro.' : ''));

    $$('#cl [data-del]', el).forEach(b => b.onclick = async () => { const r = rows.find(x => x.id === b.dataset.del); if (await confirmDlg(`Excluir “${titleOf(t, r) || 'registro'}”? Esta ação não pode ser desfeita.`, { ok: 'Excluir' })) { try { await DB.del(t, r.id); App.invalidate(t); toast('Registro excluído.'); App.render(true); } catch (e) { toast(e.message, 'bad'); } } });

  };

  el.innerHTML = `${cfg.header || ''}
    <div class="toolbar">

      <span class="sp"></span>

/* ---------------------------------------------------------------- formulário */
async function fieldInput(table, f, v, row) {
  const name = `name="${f.col}"`; const req = f.req ? 'required' : '';
  switch (f.w) {
    case 'textarea': return `<textarea class="inp" ${name} ${req}>${esc(v ?? '')}</textarea>`;
    case 'money': return `<input class="inp num" type="number" step="0.01" inputmode="decimal" ${name} ${req} value="${v ?? ''}" placeholder="0,00">`;
    case 'number': return `<input class="inp num" type="number" step="any" ${name} ${req} value="${v ?? ''}">`;
    case 'int': return `<input class="inp num" type="number" step="1" ${f.min ? `min="${f.min}"` : ''} ${f.max ? `max="${f.max}"` : ''} ${name} ${req} value="${v ?? ''}">`;
    case 'date': return `<input class="inp" type="date" ${name} ${req} value="${v ? String(v).slice(0, 10) : ''}">`;
    case 'datetime': { let s = ''; if (v) { const d = new Date(v); s = `${toISO(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; } return `<input class="inp" type="datetime-local" ${name} ${req} value="${s}">`; }
    case 'bool': return `<label class="switch"><input type="checkbox" ${name} ${v ? 'checked' : ''}>${esc(f.label)}</label>`;
    case 'color': return `<input class="inp" type="color" ${name} value="${esc(v || '#6366f1')}" style="height:40px;padding:4px">`;
    case 'url': return `<input class="inp" type="url" ${name} value="${esc(v ?? '')}" placeholder="https://">`;
    case 'select': return `<select class="sel" ${name} ${req}>${f.req ? '' : '<option value="">—</option>'}${f.opts.map(o => `<option value="${esc(o)}" ${String(v ?? '') === String(o) ? 'selected' : ''}>${esc(f.col === 'lembrete_min' ? (o == 0 ? 'Sem lembrete' : o >= 1440 ? (o / 1440) + ' dia(s) antes' : o + ' min antes') : lbl(o))}</option>`).join('')}</select>`;
    case 'member': { const ms = App.membros.filter(m => m.status === 'ativo'); const nomes = ms.map(m => App.nomeDe(m.user_id)); if (v && !nomes.includes(v)) nomes.push(v); return `<input class="inp" ${name} list="dl-${f.col}" value="${esc(v ?? '')}" placeholder="Nome"><datalist id="dl-${f.col}">${nomes.concat(['Família', 'Ethan']).map(n => `<option value="${esc(n)}">`).join('')}</datalist>`; }
    case 'catsel': { const cats = await App.data('categorias'); const vis = cats.filter(c => c.escopo === 'familia' || c.owner_id === App.me.id); const tipoR = String(row?.tipo || '').startsWith('receita'); const ord = vis.filter(c => !c.pai).sort((a, b) => (a.tipo === (tipoR ? 'receita' : 'despesa') ? -1 : 1) - (b.tipo === (tipoR ? 'receita' : 'despesa') ? -1 : 1) || a.nome.localeCompare(b.nome)); const names = ord.map(c => c.nome); if (v && !names.includes(v)) names.unshift(v); return `<input class="inp" ${name} list="dl-cat" value="${esc(v ?? '')}" placeholder="Escolha ou digite"><datalist id="dl-cat">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>`; }
    case 'ref': { const rs = await refRows(f.ref); const env = row?.escopo || App.env; const opts = rs.filter(r => r.escopo === env || r.id === v); return `<select class="sel" ${name} ${req}><option value="">—</option>${opts.map(r => `<option value="${r.id}" ${r.id === v ? 'selected' : ''}>${esc(titleOf(f.ref, r))}</option>`).join('')}</select>`; }
    default: return `<input class="inp" ${name} ${req} ${f.maxlen ? `maxlength="${f.maxlen}"` : ''} value="${esc(v ?? '')}">`;
  }
}
function readForm(table, form) {
  const out = {};
  for (const f of fieldsOf(table)) {
    const el = form.elements[f.col]; if (!el || f.w === 'hidden') continue;
    let v = f.w === 'bool' ? el.checked : el.value;
    if (typeof v === 'string') v = v.trim();
    if (['money', 'number'].includes(f.w)) v = v === '' ? null : Number(String(v).replace(',', '.'));
    else if (f.w === 'int') v = v === '' ? null : parseInt(v, 10);
    else if (f.w === 'datetime') v = v ? new Date(v).toISOString() : null;
    else if (['date', 'ref', 'select', 'url', 'color'].includes(f.w) && v === '') v = null;
    else if (v === '' && f.w !== 'bool') v = null;
    out[f.col] = v;
  }
  return out;
}

async function openForm(table, row, cfg = {}) {
  if (SEMPRE_FAMILIA.includes(table)) cfg = { ...cfg, env: 'familia', lockEnv: true };
  const spec = SPEC[table]; const isNew = !row;
  const env = row?.escopo || cfg.env || App.env;
  const canEdit = row ? (row.escopo === 'pessoal' ? row.owner_id === App.me.id : App.pode(spec.modulo, 'editar')) : true;

  const load = async () => {
    try {
      const list = await DB.list('anexos', { select: 'id,nome,mime,tamanho,created_at,owner_id', tabela: 'eq.' + table, registro_id: 'eq.' + row.id, order: 'created_at.asc' });

      $$('[data-dl]', box).forEach(b => b.onclick = () => baixarAnexo(b.closest('[data-id]').dataset.id));
      $$('[data-rm]', box).forEach(b => b.onclick = async () => { if (await confirmDlg('Remover este anexo?', { ok: 'Remover' })) { try { await DB.del('anexos', b.closest('[data-id]').dataset.id); load(); } catch (e) { toast(e.message, 'bad'); } } });

    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); upload([...e.dataTransfer.files]); };

/* lançamento efetivado: pago/recebido, ou sem status com data já passada */
const efet = (r) => r.status === 'pago' || (!r.status && (r.data_pagamento || r.data_lancamento) <= todayISO());

  const now = new Date(); const months = [];
  for (let i = n - 1; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}`); }

  const saldoIni = contas.reduce((s, c) => s + num(c.saldo_inicial), 0);
  const saldo = saldoIni + pagos.filter(isRec).reduce((s, r) => s + num(r.valor), 0) - pagos.filter(r => SAIDA.includes(r.tipo)).reduce((s, r) => s + num(r.valor), 0);

  const doMes = L.filter(r => monthKey(r.data_lancamento) === mk);
  const rec = doMes.filter(isRec).reduce((s, r) => s + num(r.valor), 0);
  const desp = doMes.filter(r => DESP.includes(r.tipo)).reduce((s, r) => s + num(r.valor), 0);
  const pend = L.filter(r => r.status === 'pendente' && !isRec(r));

  const aReceber = L.filter(r => r.status === 'pendente' && isRec(r));

}

function occurrences(ev, from, to) {
  const out = []; const s0 = new Date(ev.inicio); const dur = ev.fim ? new Date(ev.fim) - s0 : 3600000; const rec = ev.recorrencia || 'nenhuma';
  const F = new Date(from), T = new Date(to); let s = new Date(s0); let guard = 0;
  while (s <= T && guard++ < 800) {
    if (s >= F || new Date(s.getTime() + dur) >= F) out.push({ ev, start: new Date(s), end: new Date(s.getTime() + dur) });
    if (rec === 'nenhuma') break;
    if (rec === 'diaria') s.setDate(s.getDate() + 1); else if (rec === 'semanal') s.setDate(s.getDate() + 7); else if (rec === 'mensal') s.setMonth(s.getMonth() + 1); else if (rec === 'anual') s.setFullYear(s.getFullYear() + 1); else break;
  }
  return out;
}
const CAT_COR = { consulta: '#ef4444', reuniao: '#0ea5e9', escola: '#8b5cf6', esporte: '#10b981', viagem: '#14b8a6', aniversario: '#ec4899', pagamento: '#f59e0b', pessoal: '#64748b', familia: '#4f46e5', outro: '#78716c' };
function nextAnniv(dateISO) { const d = parseD(dateISO); const now = parseD(todayISO()); let n = new Date(now.getFullYear(), d.getMonth(), d.getDate()); if (n < now) n = new Date(now.getFullYear() + 1, d.getMonth(), d.getDate()); return n; }
function agendaItems(d, from, to, env = null) {
  const items = [];
  d.eventos.filter(e => !env || e.escopo === env).forEach(e => occurrences(e, from, to).forEach(o => items.push({ kind: 'ev', ...o, title: e.titulo, cor: CAT_COR[e.categoria] || '#4f46e5', escopo: e.escopo })));
  d.datas_especiais.filter(e => !env || e.escopo === env).forEach(x => { const base = parseD(x.data); for (let y = new Date(from).getFullYear(); y <= new Date(to).getFullYear(); y++) { const dt = x.recorrente ? new Date(y, base.getMonth(), base.getDate()) : base; if (dt >= new Date(new Date(from).toDateString()) && dt <= new Date(to)) items.push({ kind: 'data', ev: x, start: dt, end: dt, allDay: true, title: (x.tipo === 'aniversario' ? '🎂 ' : '★ ') + x.nome, cor: '#ec4899', escopo: x.escopo }); if (!x.recorrente) break; } });
  (d.lancamentos || []).filter(l => l.status === 'pendente' && !isRec(l) && (!env || l.escopo === env)).forEach(l => { const dt = parseD(l.data_vencimento || l.data_lancamento); if (dt >= new Date(new Date(from).toDateString()) && dt <= new Date(to)) items.push({ kind: 'conta', ev: l, start: dt, end: dt, allDay: true, title: '💳 ' + l.descricao + ' · ' + money(l.valor), cor: '#f59e0b', escopo: l.escopo }); });
  return items.sort((a, b) => a.start - b.start);
}

/* ---------------------------------------------------------------- NOTIFICAÇÕES */
async function computeNotifs() {
  const d = await loadAll(['lancamentos', 'eventos', 'datas_especiais', 'compras_listas', 'compras_itens', 'documentos', 'objetivos', 'ethan_vacinas', 'ethan_saude', 'avisos', 'patrimonio', 'casa_itens', 'saude_familia', 'tarefas']);
  const N = []; const hoje = todayISO(); const now = Date.now();
  const push = (key, o) => N.push({ key, ...o });
  d.lancamentos.filter(r => r.status === 'pendente' && !isRec(r)).forEach(r => { const v = r.data_vencimento || r.data_lancamento; const dd = daysBetween(hoje, v); if (dd <= 5) push(`conta:${r.id}:${v}`, { icon: 'money', tone: dd < 0 ? 'bad' : 'warn', title: (dd < 0 ? 'Conta atrasada: ' : 'Conta vence ' + (dd === 0 ? 'hoje' : `em ${dd} dia(s)`) + ': ') + r.descricao, sub: `${money(r.valor)} · ${fmtD(v)}${r.escopo === 'pessoal' ? ' · pessoal' : ''}`, when: v, route: 'pagar' }); });
  d.eventos.forEach(e => occurrences(e, new Date(now - 36e5), new Date(now + 2 * 864e5)).forEach(o => { const min = num(e.lembrete_min ?? 60); if (o.start - now <= Math.max(min, 1440) * 6e4) push(`ev:${e.id}:${o.start.toISOString().slice(0, 16)}`, { icon: 'calendar', tone: 'info', title: 'Compromisso: ' + e.titulo, sub: `${o.start.toLocaleString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}${e.local ? ' · ' + e.local : ''}`, when: o.start.toISOString(), route: 'calendario', alertAt: o.start - min * 6e4 }); }));
  d.datas_especiais.forEach(x => { const n = nextAnniv(x.data); const dd = daysBetween(hoje, toISO(n)); if (dd <= num(x.lembrar_dias ?? 7)) push(`data:${x.id}:${n.getFullYear()}`, { icon: 'gift', tone: 'pri', title: (dd === 0 ? 'Hoje: ' : `Em ${dd} dia(s): `) + x.nome, sub: lbl(x.tipo) + ' · ' + n.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' }), when: toISO(n), route: 'aniversarios' }); });
  d.compras_listas.filter(l => l.status === 'aberta').forEach(l => { const p = d.compras_itens.filter(i => i.lista_id === l.id && i.status === 'pendente').length; if (p) push(`compras:${l.id}:${p}`, { icon: 'cart', tone: 'warn', title: `${p} item(ns) pendente(s) em “${l.nome}”`, sub: 'Lista de compras', when: hoje, route: 'compras' }); });
  d.documentos.filter(x => x.data_validade).forEach(x => { const dd = daysBetween(hoje, x.data_validade); if (dd <= 30) push(`doc:${x.id}:${x.data_validade}`, { icon: 'doc', tone: dd < 0 ? 'bad' : 'warn', title: (dd < 0 ? 'Documento vencido: ' : `Documento vence em ${dd} dia(s): `) + x.nome, sub: fmtD(x.data_validade), when: x.data_validade, route: 'documentos' }); });
  d.patrimonio.forEach(p => [['licenciamento', 'Licenciamento'], ['seguro_validade', 'Seguro'], ['proxima_revisao', 'Revisão']].forEach(([c, n]) => { if (p[c] && daysBetween(hoje, p[c]) <= 30) push(`patr:${p.id}:${c}:${p[c]}`, { icon: 'car', tone: 'warn', title: `${n} — ${p.nome}`, sub: fmtD(p[c]), when: p[c], route: 'patrimonio' }); }));
  d.objetivos.filter(o => o.prazo && !['atingido', 'cancelado'].includes(o.status)).forEach(o => { const dd = daysBetween(hoje, o.prazo); if (dd <= 30) push(`meta:${o.id}:${o.prazo}`, { icon: 'target', tone: 'warn', title: `Meta “${o.nome}” ${dd < 0 ? 'passou do prazo' : 'termina em ' + dd + ' dia(s)'}`, sub: fmtD(o.prazo), when: o.prazo, route: 'sonhos' }); });
  d.ethan_vacinas.filter(v => !v.data_aplicada && v.data_prevista && daysBetween(hoje, v.data_prevista) <= 15).forEach(v => push(`vac:${v.id}:${v.data_prevista}`, { icon: 'shield', tone: daysBetween(hoje, v.data_prevista) < 0 ? 'bad' : 'pri', title: `Vacina do Ethan: ${v.vacina}${v.dose ? ' (' + v.dose + ')' : ''}`, sub: fmtD(v.data_prevista), when: v.data_prevista, route: 'ethan_vacinas' }));
  d.ethan_saude.filter(s => s.proximo_retorno && daysBetween(hoje, s.proximo_retorno) <= 15 && daysBetween(hoje, s.proximo_retorno) >= -1).forEach(s => push(`es:${s.id}:${s.proximo_retorno}`, { icon: 'child', tone: 'pri', title: `Ethan — retorno: ${s.descricao}`, sub: fmtD(s.proximo_retorno), when: s.proximo_retorno, route: 'ethan_saude' }));
  d.saude_familia.filter(s => s.retorno && daysBetween(hoje, s.retorno) <= 15 && daysBetween(hoje, s.retorno) >= -1).forEach(s => push(`sf:${s.id}:${s.retorno}`, { icon: 'heart', tone: 'info', title: `Acompanhamento: ${s.descricao}`, sub: `${s.pessoa || ''} · ${fmtD(s.retorno)}`, when: s.retorno, route: 'saude' }));
  d.casa_itens.filter(c => c.garantia_ate && daysBetween(hoje, c.garantia_ate) <= 30 && daysBetween(hoje, c.garantia_ate) >= -7).forEach(c => push(`gar:${c.id}:${c.garantia_ate}`, { icon: 'tool', tone: 'warn', title: `Garantia acabando: ${c.titulo}`, sub: fmtD(c.garantia_ate), when: c.garantia_ate, route: 'casa' }));
  d.tarefas.filter(t => t.status !== 'feito' && t.prazo && daysBetween(hoje, t.prazo) <= 2).forEach(t => push(`tar:${t.id}:${t.prazo}`, { icon: 'checksq', tone: daysBetween(hoje, t.prazo) < 0 ? 'bad' : 'warn', title: 'Tarefa: ' + t.titulo, sub: `${t.responsavel || ''} · prazo ${fmtD(t.prazo)}`, when: t.prazo, route: 'tarefas' }));
  d.avisos.filter(a => a.ativo).forEach(a => push(`aviso:${a.id}:${a.updated_at}`, { icon: 'bell', tone: 'pri', title: 'Aviso: ' + a.titulo, sub: a.mensagem || '', when: a.created_at, route: 'notificacoes' }));
  let lidas = []; try { lidas = (await DB.list('notificacoes_lidas', { select: 'chave' })).map(x => x.chave); } catch (_) { }
  N.forEach(n => n.lida = lidas.includes(n.key));
  return N.sort((a, b) => (a.lida - b.lida) || String(a.when).localeCompare(String(b.when)));
}
async function updateNotifBadge() {
  try {
    const N = await computeNotifs(); const n = N.filter(x => !x.lida).length;
    $$('.nb').forEach(b => { b.textContent = n > 99 ? '99+' : n; b.classList.toggle('hidden', !n); });
    if ('Notification' in window && Notification.permission === 'granted') {
      let shown = []; try { shown = JSON.parse(sessionStorage.getItem('fam_shown') || '[]'); } catch (_) { }
      N.filter(x => !x.lida && !shown.includes(x.key) && (!x.alertAt || x.alertAt <= Date.now())).slice(0, 3).forEach(x => { try { new Notification('FAMILIA — ' + x.title, { body: x.sub, tag: x.key }); } catch (_) { } shown.push(x.key); });
      try { sessionStorage.setItem('fam_shown', JSON.stringify(shown.slice(-300))); } catch (_) { }
    }
  } catch (_) { }
}
VIEWS.notificacoes = async (el) => {
  const N = await computeNotifs(); const st = VIEWS.notificacoes.st || (VIEWS.notificacoes.st = { f: 'nao' });
  const list = N.filter(n => st.f === 'todas' || !n.lida);
  el.innerHTML = `<div class="toolbar"><div class="seg"><button data-f="nao" class="${st.f === 'nao' ? 'on' : ''}">Não lidas (${N.filter(n => !n.lida).length})</button><button data-f="todas" class="${st.f === 'todas' ? 'on' : ''}">Todas (${N.length})</button></div><span class="sp"></span>
    ${'Notification' in window && Notification.permission !== 'granted' ? `<button class="btn" id="nperm">${ic('bell')}Ativar alertas no navegador</button>` : ''}
    <button class="btn" id="nall" ${!N.some(n => !n.lida) ? 'disabled' : ''}>${ic('check')}Marcar todas como lidas</button></div>
    <div class="card" style="padding:6px 16px">${list.length ? `<div class="list">${list.map(n => `<div class="li" data-k="${esc(n.key)}" style="${n.lida ? 'opacity:.55' : ''}"><div class="ic ${n.tone}">${ic(n.icon)}</div><div class="grow" style="cursor:pointer" data-r="${n.route}"><div class="t">${esc(n.title)}</div><div class="s">${esc(n.sub)}</div></div>${n.lida ? '<span class="badge">lida</span>' : `<button class="btn ghost sm" data-read>${ic('check')}Lida</button>`}</div>`).join('')}</div>` : emptyHTML('bell', 'Tudo em dia!', 'Nenhuma notificação pendente.')}</div>`;
  $$('[data-f]', el).forEach(b => b.onclick = () => { st.f = b.dataset.f; App.render(true); });
  $$('[data-r]', el).forEach(d => d.onclick = () => App.go(d.dataset.r));
  const mark = async (keys) => { try { await DB.req('/notificacoes_lidas', { method: 'POST', body: keys.map(chave => ({ chave })), headers: { Prefer: 'resolution=ignore-duplicates,return=minimal' } }); App.render(true); } catch (e) { toast(e.message, 'bad'); } };
  $$('[data-read]', el).forEach(b => b.onclick = () => mark([b.closest('[data-k]').dataset.k]));
  $('#nall', el).onclick = () => mark(N.filter(n => !n.lida).map(n => n.key));
  $('#nperm', el) && ($('#nperm', el).onclick = async () => { const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Alertas do navegador ativados.' : 'Permissão negada pelo navegador.', p === 'granted' ? 'ok' : 'bad'); App.render(true); });
};

  return `${m.getFullYear()}-${pad(m.getMonth() + 1)}`;
}

    for (const f of files) {

    box.innerHTML = `<div class="card"><div class="card-h"><div class="ic">${ic('checksq')}</div><h3>Conferência (${st.cands.filter(c => c.ok).length} de ${st.cands.length} selecionados)</h3><div class="r"><div class="seg" id="ienv"><button data-v="familia" class="${App.env === 'familia' ? 'on' : ''}">Família</button><button data-v="pessoal" class="${App.env === 'pessoal' ? 'on' : ''}">Pessoal</button></div><button class="btn" id="iclr">Limpar</button><button class="btn pri" id="isave">${ic('check')}Gravar selecionados</button></div></div>
      <div class="tbl-wrap" style="box-shadow:none"><table class="tbl"><thead><tr><th></th><th>Descrição</th><th>Valor</th><th>Data</th><th>Vencimento</th><th>Tipo</th><th>Categoria</th><th>Forma</th><th>Parc.</th><th>Alertas</th></tr></thead><tbody>
      ${st.cands.map((c, i) => `<tr data-i="${i}" style="${c.ok ? '' : 'opacity:.7'}"><td><input type="checkbox" data-k="ok" ${c.ok ? 'checked' : ''}></td><td><input class="inp" data-k="descricao" value="${esc(c.descricao)}" style="min-width:180px"></td><td><input class="inp num" type="number" step="0.01" data-k="valor" value="${c.valor ?? ''}" style="width:110px"></td><td><input class="inp" type="date" data-k="data" value="${c.data || ''}"></td><td><input class="inp" type="date" data-k="vencimento" value="${c.vencimento || ''}"></td>
        <td><select class="sel" data-k="tipo">${SPEC.lancamentos.fields[0].opts.map(o => `<option value="${o}" ${c.tipo === o ? 'selected' : ''}>${lbl(o)}</option>`).join('')}</select></td><td><input class="inp" list="icats" data-k="categoria" value="${esc(c.categoria || '')}" style="min-width:130px"></td>
        <td><select class="sel" data-k="forma_pagamento"><option value="">—</option>${['pix', 'dinheiro', 'debito', 'credito', 'boleto', 'transferencia', 'outro'].map(o => `<option value="${o}" ${c.forma_pagamento === o ? 'selected' : ''}>${lbl(o)}</option>`).join('')}</select></td><td><input class="inp num" type="number" min="1" data-k="parcelas" value="${c.parcelas || ''}" style="width:64px"></td>
        <td>${c.dup ? `<span class="badge bad" title="${esc(c.dup)}">${ic('copy')}Possível duplicado</span>` : ''}${c.confianca === 'baixa' ? `<span class="badge warn">Leitura duvidosa</span>` : c.confianca === 'media' ? '<span class="badge">Revisar</span>' : '<span class="badge ok">Boa leitura</span>'}<div class="muted" style="font-size:11px">${esc(c.origem)}</div></td></tr>`).join('')}</tbody></table></div><datalist id="icats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>`;
    let envSel = App.env;
    $$('#ienv button', box).forEach(b => b.onclick = () => { envSel = b.dataset.v; $$('#ienv button', box).forEach(x => x.classList.toggle('on', x === b)); });

      } catch (e) { toast(e.message, 'bad'); b.disabled = false; b.innerHTML = ic('check') + 'Gravar selecionados'; }

};

function comprasHistorico(body, itens, listas) {

  const porProd = {}; comprados.forEach(i => { const k = norm(i.nome); (porProd[k] = porProd[k] || { nome: i.nome, h: [] }).h.push(i); });
  const prods = Object.values(porProd).map(p => { p.h.sort((a, b) => (a.data_compra || '') < (b.data_compra || '') ? -1 : 1); const unit = p.h.map(i => num(i.preco_pago) / Math.max(num(i.qtd_comprada || i.quantidade || 1), 1)); p.min = Math.min(...unit); p.max = Math.max(...unit); p.ult = unit[unit.length - 1]; p.n = p.h.length; return p; }).sort((a, b) => b.n - a.n);
  const concl = listas.filter(l => l.status !== 'aberta').map(l => ({ l, tot: itens.filter(i => i.lista_id === l.id).reduce((s, i) => s + num(i.preco_pago), 0) })).filter(x => x.tot);

    <div class="section-t">Comparativo de preços (preço unitário)</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Produto</th><th class="r">Compras</th><th class="r">Menor</th><th class="r">Maior</th><th class="r">Último</th><th class="hide-m">Onde foi mais barato</th></tr></thead><tbody>
    ${prods.map(p => { const best = p.h.reduce((a, i) => (num(i.preco_pago) / Math.max(num(i.qtd_comprada || i.quantidade || 1), 1)) <= (num(a.preco_pago) / Math.max(num(a.qtd_comprada || a.quantidade || 1), 1)) ? i : a); return `<tr><td>${esc(p.nome)}</td><td class="r">${p.n}</td><td class="r num pos">${money(p.min)}</td><td class="r num neg">${money(p.max)}</td><td class="r num">${money(p.ult)} ${p.ult > p.min * 1.1 ? '<span class="badge warn">acima</span>' : ''}</td><td class="hide-m">${esc(best.estabelecimento || '—')} ${best.data_compra ? '· ' + fmtD(best.data_compra) : ''}</td></tr>`; }).join('') || '<tr><td colspan=6 class="muted">Registre o preço pago no modo supermercado para comparar.</td></tr>'}</tbody></table></div>`;
  if (concl.length) mkChart($('#ch1', body), { type: 'bar', data: { labels: concl.slice().reverse().map(x => x.l.data_compra ? fmtD(x.l.data_compra) : x.l.nome), datasets: [{ label: 'Total pago', data: concl.slice().reverse().map(x => x.tot), backgroundColor: chartColors().sec, borderRadius: 6 }] }, options: { plugins: { legend: { display: false } } } }); else $('#ch1', body).parentElement.innerHTML = emptyHTML('chart', 'Sem compras concluídas');
}

  const md = modal({ title: App.nomeDe(m.user_id), icon: 'user', body: `<div class="row" style="margin-bottom:16px">${avHTML(m.user_id, 'lg', App.online(m.user_id))}<div><div class="muted">${esc(m.email || '')}</div><div class="row" style="gap:6px;margin-top:4px"><span class="badge pri">${lbl(m.papel)}</span><span class="badge ${m.status === 'ativo' ? 'ok' : 'bad'}">${lbl(m.status)}</span></div></div></div>
    <div class="form"><div class="fld"><label>Nome de identificação</label><input class="inp" id="mn" value="${esc(m.nome || '')}"></div><div class="fld"><label>Perfil</label><select class="sel" id="mp"><option value="membro" ${m.papel === 'membro' ? 'selected' : ''}>Membro</option><option value="superadmin" ${m.papel === 'superadmin' ? 'selected' : ''}>Superadministrador</option></select></div></div>
    <div class="section-t">Ações de acesso</div><div class="row wrap" style="gap:8px">
      ${!me ? (m.status === 'ativo' ? `<button class="btn danger" data-a="bloq">${ic('lock')}Bloquear</button>` : `<button class="btn" data-a="desb">${ic('check')}Desbloquear</button>`) : ''}
      <button class="btn" data-a="sess">${ic('logout')}Encerrar sessões</button><button class="btn" data-a="reset">${ic('key')}Enviar redefinição de senha</button>
      ${!me ? `<button class="btn danger" data-a="rem">${ic('trash')}Remover da família</button>` : ''}</div>
    <p class="muted" style="font-size:12px;margin-top:12px">Bloquear encerra as sessões ativas e impede o acesso aos dados (verificado pelo banco). Remover tira a pessoa da família; os registros que ela criou na família continuam.</p>`,
    foot: `<button class="btn" data-c>Fechar</button><button class="btn pri" data-s>${ic('check')}Salvar</button>` });
  $('[data-c]', md.el).onclick = md.close;
  $('[data-s]', md.el).onclick = () => { md.close(); adminSalvar(m, { nome: $('#mn', md.el).value, papel: $('#mp', md.el).value }); };
  $$('[data-a]', md.el).forEach(b => b.onclick = async () => {
    const a = b.dataset.a;
    try {
      if (a === 'bloq' && await confirmDlg(`Bloquear ${App.nomeDe(m.user_id)}?`, { ok: 'Bloquear' })) { md.close(); adminSalvar(m, { status: 'bloqueado' }); }
      if (a === 'desb') { md.close(); adminSalvar(m, { status: 'ativo' }); }
      if (a === 'sess' && await confirmDlg('Encerrar todas as sessões deste usuário? Ele precisará entrar de novo.', { ok: 'Encerrar', danger: false })) { const n = await DB.rpc('admin_encerrar_sessoes', { p_user: m.user_id }); toast(`${n} sessão(ões) encerrada(s).`); }
      if (a === 'reset') { if (!m.email) return toast('Usuário sem e-mail.', 'bad'); await Auth.forgot(m.email); toast('E-mail de redefinição enviado para ' + m.email, 'ok', 5000); }
      if (a === 'rem' && await confirmDlg(`Remover ${App.nomeDe(m.user_id)} da família?`, { ok: 'Remover' })) { await DB.rpc('admin_remover_membro', { p_user: m.user_id }); await refreshMembros(); md.close(); toast('Removido.'); App.render(true); }
    } catch (e) { toast(e.message, 'bad'); }
  });
}

function resizeImage(file, max = 256, q = .85) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); URL.revokeObjectURL(img.src); }; img.onerror = rej; img.src = URL.createObjectURL(file); });
}

function periodoDe(q) {
  const h = todayISO(); const mk = monthKey(h);
  let m = q.match(/ultim[oa]s?\s+(\d+|\w+)\s+mes/); if (m) { const n = +m[1] || NUMS[m[1]] || 3; return { de: addMonths(h, -(n - 1)).slice(0, 8) + '01', ate: h, nome: `nos últimos ${n} meses` }; }
  if (/mes passado|mes anterior/.test(q)) { const a = addMonths(mk + '-01', -1); return { de: a, ate: toISO(new Date(parseD(a).getFullYear(), parseD(a).getMonth() + 1, 0)), nome: 'no mês passado' }; }
  if (/este ano|neste ano|no ano|anual/.test(q)) return { de: h.slice(0, 4) + '-01-01', ate: h, nome: 'neste ano' };
  if (/semana/.test(q)) return { de: addDays(h, -6), ate: h, nome: 'nos últimos 7 dias' };
  if (/hoje/.test(q)) return { de: h, ate: h, nome: 'hoje' };
  return { de: mk + '-01', ate: h, nome: 'neste mês' };
}

function renderAuth(mode = 'in') {
  App.stopTimers(); const c = loginCfg();
  document.documentElement.style.setProperty('--lx1', c.cor); document.documentElement.style.setProperty('--lx2', c.cor2);
  $('#app').innerHTML = `<div class="lx">${starsHTML(c)}<div class="lx-grid"></div>
   ${loginArtHTML(c)}
   <div class="lx-box"><div class="lx-card">
     <div class="lx-brand"><div class="mk">${ic('family')}</div>${esc(c.titulo)}</div>
     <h2>${mode === 'in' ? esc(c.boasVindas) : 'Criar sua conta'}</h2>
     <div class="sub">${mode === 'in' ? 'Entre para ver o que está acontecendo hoje.' : 'O acesso à família é liberado pelo administrador.'}</div>
     <div class="lx-tabs"><button data-m="in" class="${mode === 'in' ? 'on' : ''}">Entrar</button><button data-m="up" class="${mode === 'up' ? 'on' : ''}">Criar conta</button></div>
     <form id="af" autocomplete="on">
       ${mode === 'up' ? `<div class="lx-f"><label>Nome</label><input name="name" autocomplete="name" placeholder="Como quer ser chamado" required></div>` : ''}
       <div class="lx-f"><label>E-mail ou usuário</label><input name="email" required autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="voce@email.com ou admin"></div>
       <div class="lx-f"><label>Senha</label><input name="password" type="password" required minlength="8" autocomplete="${mode === 'in' ? 'current-password' : 'new-password'}" placeholder="mínimo 8 caracteres"></div>
       <button class="lx-btn" id="ab" type="submit">${mode === 'in' ? 'Entrar' : 'Criar conta'}</button>
       ${mode === 'in' ? '<button type="button" class="lx-link" id="fg">Esqueci minha senha</button>' : ''}
       <div class="lx-err" id="ae"></div>
       ${location.protocol === 'file:' ? `<div class="lx-err" style="display:block;margin-top:14px">Você abriu o arquivo direto do computador. O login só funciona pelo site publicado: <b>https://edilson0404.github.io/Familia/</b></div>` : ''}
     </form>
     <div class="lx-foot">${ic('lock')}Conexão segura · dados pessoais protegidos no próprio banco</div>
   </div></div></div>`;
  $$('.lx-tabs button').forEach(b => b.onclick = () => renderAuth(b.dataset.m));
  const showErr = (m) => { const e = $('#ae'); e.textContent = m; e.style.display = 'block'; };
  $('#fg') && ($('#fg').onclick = async () => {
    const email = $('[name=email]').value.trim(); if (!email) return showErr('Digite seu e-mail acima primeiro.');
    if (!email.includes('@')) return showErr('Contas de usuário (sem e-mail) não recebem link: peça ao superadministrador.');
    try { await Auth.forgot(email); toast('Se o e-mail existir, enviamos um link para redefinir a senha.', 'info', 6000); } catch (e) { showErr(e.message); }
  });
  $('#af').onsubmit = async (ev) => {
    ev.preventDefault(); const f = new FormData(ev.target); const b = $('#ab'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
    try {
      const login = toLogin(f.get('email'));
      if (String(f.get('password')).length < 8) throw new Error('A senha precisa ter pelo menos 8 caracteres.');
      if (mode === 'in') await Auth.signIn(login, f.get('password'));
      else { if (!String(f.get('name') || '').trim()) throw new Error('Informe seu nome.'); await Auth.signUp(f.get('name').trim(), login, f.get('password')); }
      await Auth.session(); await Auth.token(true); App.afterLogin();
    } catch (e) { showErr(e.message === 'SESSAO' ? 'Login feito, mas o navegador bloqueou o cookie de sessão (cookies de terceiros). Veja o LEIA-ME.' : e.message); b.disabled = false; b.textContent = mode === 'in' ? 'Entrar' : 'Criar conta'; }
  };
}

      const q = `${Number(i.quantidade || 1).toLocaleString('pt-BR')} ${i.unidade || 'un'}`; x.font = `700 27px ${FONT}`; x.fillStyle = '#4a5168'; x.textAlign = 'right'; x.fillText(q, W - P - 18, cy + 10);

}
async function exportarListaPNG(lista, its) {
  const op = { todos: false, precos: false };
  const m = modal({ title: 'Exportar lista em imagem (PNG)', icon: 'download', size: 'lg', body: `<div class="row wrap" style="margin-bottom:12px;gap:10px"><div class="seg" id="pt"><button data-v="0" class="on">Só o que falta comprar</button><button data-v="1">Lista completa</button></div><label class="switch"><input type="checkbox" id="pp">Mostrar preços</label></div>
    <div style="background:var(--bg2);border-radius:14px;padding:14px;text-align:center;max-height:60vh;overflow:auto"><img id="pimg" style="max-width:100%;border-radius:10px;box-shadow:var(--sh2)" alt="Prévia"></div>
    <div class="muted" style="font-size:12.5px;margin-top:8px">No celular, “Compartilhar” abre o WhatsApp e outros apps com a imagem pronta para enviar.</div>`,
    foot: `<button class="btn" data-c>Fechar</button><button class="btn" id="pdl">${ic('download')}Baixar PNG</button><button class="btn pri" id="psh">${ic('send')}Compartilhar</button>` });
  $('[data-c]', m.el).onclick = m.close;
  let cv;

  $$('#pt button', m.el).forEach(b => b.onclick = () => { op.todos = b.dataset.v === '1'; $$('#pt button', m.el).forEach(x => x.classList.toggle('on', x === b)); draw(); });
  $('#pp', m.el).onchange = (e) => { op.precos = e.target.checked; draw(); };
  const nomeArq = `Compras - ${lista.nome} - ${todayISO()}.png`.replace(/[\\/:*?"<>|]/g, '');
  $('#pdl', m.el).onclick = () => { const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = nomeArq; a.click(); toast('Imagem baixada.'); };
  $('#psh', m.el).onclick = () => cv.toBlob(async (blob) => {
    const file = new File([blob], nomeArq, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Lista de compras', text: lista.nome }); } catch (_) { } }

    case 'int': { const n = typeof v === 'number' ? Math.round(v) : parseInt(String(v).replace(/\D/g, ''), 10); if (isNaN(n)) { erros.push(`linha ${ln}: “${f.label}” não é um número inteiro`); return null; } return n; }
    case 'date': { const d = parseDataBR(v); if (!d) erros.push(`linha ${ln}: data inválida em “${f.label}” (${v})`); return d; }
    case 'datetime': { const d = plParseDT(v); if (!d) erros.push(`linha ${ln}: data/hora inválida em “${f.label}” (${v})`); return d; }
    case 'bool': return /^(s|sim|true|verdadeiro|1|x|yes)$/i.test(String(v).trim());
    case 'select': { const n = norm(v); const o = f.opts.find(o => norm(o) === n || norm(lbl(o)) === n || norm(String(o).replace(/_/g, ' ')) === n); if (o === undefined) { erros.push(`linha ${ln}: “${v}” não é uma opção válida para “${f.label}” (veja a aba LEIA-ME)`); return null; } return o; }
    case 'url': return String(v);
    default: return String(v);
  }
}
async function plLer(file) {
  await loadScript(LIBS.xlsx);
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  const plano = [];
  for (const nome of wb.SheetNames) {
    const t = PL_ORDEM.find(x => norm(plSheetName(x)) === norm(nome) || norm(x) === norm(nome)); if (!t) continue;
    const linhas = XLSX.utils.sheet_to_json(wb.Sheets[nome], { defval: '', raw: true });
    const fs = plCampos(t); const erros = [], novos = [], atualiza = []; let ignoradas = 0;
    linhas.forEach((row, i) => {
      const ln = i + 2; const get = (h, f) => { const k = Object.keys(row).find(k => norm(k).replace(/\s*\*$/, '') === norm(h) || (f && norm(k) === norm(f.col))); return k !== undefined ? row[k] : ''; };
      const id = String(get(PL_ID) || '').trim();
      if (/^exemplo/i.test(id)) { ignoradas++; return; }
      const valores = fs.map(f => get(f.label, f)); if (valores.every(v => v === '' || v === null) ) { ignoradas++; return; }
      const rec = {}; const errLinha = [];
      fs.forEach((f, k) => { if (f.w === 'ref') { const v = String(valores[k] || '').trim(); rec['__ref_' + f.col] = v || null; if (!v && f.req) errLinha.push(`linha ${ln}: “${f.label}” é obrigatório`); } else rec[f.col] = plConverter(t, f, valores[k], errLinha, ln); });
      const amb = norm(get(PL_AMB) || get('Ambiente')); rec.escopo = amb.startsWith('pess') ? 'pessoal' : 'familia';
      if (errLinha.length) { erros.push(...errLinha); return; }
      if (id) atualiza.push({ id, rec, ln }); else novos.push({ rec, ln });
    });
    plano.push({ t, nome, novos, atualiza, erros, ignoradas });
  }
  return plano.sort((a, b) => PL_ORDEM.indexOf(a.t) - PL_ORDEM.indexOf(b.t));
}
async function plExecutar(plano, progresso) {
  const res = []; const criadosPorTabela = {};
  for (const p of plano) {
    const fs = plCampos(p.t); let ok = 0; const errs = [];
    const refsNec = [...new Set(fs.filter(f => f.w === 'ref').map(f => f.ref))];
    const refRows = Object.fromEntries(await Promise.all(refsNec.map(async r => [r, [...(await App.data(r, { force: true }).catch(() => [])), ...(criadosPorTabela[r] || [])]])));
    const resolver = (item) => { const rec = { ...item.rec }; for (const f of fs.filter(f => f.w === 'ref')) { const nome = rec['__ref_' + f.col]; delete rec['__ref_' + f.col]; if (!nome) { rec[f.col] = null; continue; } const alvo = (refRows[f.ref] || []).find(r => norm(titleOf(f.ref, r)) === norm(nome) && (r.escopo === rec.escopo || r.escopo === 'familia')); if (!alvo) throw new Error(`linha ${item.ln}: “${nome}” não encontrado em ${SPEC[f.ref].label}`); rec[f.col] = alvo.id; } return rec; };
    const lote = []; for (const it of p.novos) { try { lote.push(resolver(it)); } catch (e) { errs.push(e.message); } }
    for (let i = 0; i < lote.length; i += 200) { progresso(`${SPEC[p.t].label}: gravando ${Math.min(i + 200, lote.length)}/${lote.length}`); try { const r = await DB.insert(p.t, lote.slice(i, i + 200)); ok += r.length; (criadosPorTabela[p.t] ||= []).push(...r); } catch (e) { errs.push(e.message); } }
    for (const it of p.atualiza) { progresso(`${SPEC[p.t].label}: atualizando linha ${it.ln}`); try { const rec = resolver(it); delete rec.escopo; await DB.update(p.t, it.id, rec); ok++; } catch (e) { errs.push(`linha ${it.ln}: ${e.message}`); } }
    App.invalidate(p.t); res.push({ ...p, ok, errsExec: errs });
  }
  return res;
}

VIEWS.planilha = async (el) => {

    <div class="card"><div class="card-h"><div class="ic info">${ic('edit')}</div><h3>2. Preencha no Excel</h3></div><p class="tx2" style="font-size:13.5px;margin-top:0">Apague a linha de exemplo e coloque seus dados. Use só as abas que quiser. Também dá para exportar seus dados atuais, corrigir no Excel e importar de novo para <b>atualizar</b>.</p><button class="btn" id="pexp">${ic('download')}Exportar meus dados</button></div>

   <label class="drop" id="pdrop" style="display:block">${ic('sheet')}<div style="font-weight:700;margin:6px 0">Arraste a planilha aqui ou clique para escolher</div><div style="font-size:12.5px">.xlsx, .xls ou .ods</div><input type="file" hidden accept=".xlsx,.xls,.ods"></label>
